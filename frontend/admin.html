<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Administrativo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container admin-container">

    <h1>Painel Administrativo</h1>

    <p id="usuarioLogado"></p>

    <button onclick="logoutAdmin()" class="btn-sair">
    Sair
    </button>
    
<div class="admin-busca">
    <input
        type="text"
        id="campoBuscaReserva"
        placeholder="Buscar por código da reserva"
    >

    <button onclick="buscarReservaPorCodigo()">
        Buscar
    </button>

    <button onclick="limparBuscaReserva()">
        Limpar
    </button>
</div>

    <div class="admin-grid">

        <section>
            <h2>Alterações solicitadas</h2>
            <div id="reservasAlteracao">
                <p>Carregando...</p>
            </div>
        </section>

        <section>
            <h2>Cancelamentos solicitados</h2>
            <div id="reservasCancelamento">
                <p>Carregando...</p>
            </div>
        </section>

        <section>
            <h2>Reservas confirmadas</h2>
            <div id="reservasConfirmadas">
                <p>Carregando...</p>
            </div>
        </section>

        <section>
            <h2>Outras reservas</h2>
            <div id="reservasOutras">
                <p>Carregando...</p>
            </div>
        </section>

    </div>

</div>

<script src="admin.js"></script>

</body>
</html>
