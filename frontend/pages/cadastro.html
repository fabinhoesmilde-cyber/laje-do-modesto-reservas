<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Cadastro - Laje do Modesto</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/cliente.css">
</head>
<body>
  <main class="container">
    <h1>Criar conta</h1>
    <p>Preencha seus dados. Enviaremos um link por e-mail para você confirmar e criar sua senha.</p>

    <form id="formCadastro">
      <label for="nome">Nome completo</label>
      <input type="text" id="nome" maxlength="150" autocomplete="name" required>

      <label for="email">E-mail</label>
      <input type="email" id="email" autocomplete="email" required>

      <label for="cpf">CPF</label>
      <input type="text" id="cpf" inputmode="numeric" placeholder="000.000.000-00" required>

      <label for="telefone">Telefone com DDD</label>
      <input type="tel" id="telefone" placeholder="(21) 99999-9999" autocomplete="tel" required>

      <button type="submit" id="botaoCadastro">Criar conta</button>
    </form>

    <p id="mensagemCadastro" class="msg" role="status"></p>

    <div class="links-auxiliares">
      <a href="entrar.html">Já tenho conta</a><br>
      <a href="index.html">Voltar para a home</a>
    </div>
  </main>

  <script src="../js/cliente/api.js"></script>
  <script src="../js/cliente/cadastro.js"></script>
</body>
</html>
