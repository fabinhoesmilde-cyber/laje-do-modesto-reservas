<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Esqueci a senha - Laje do Modesto</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/cliente.css">
</head>
<body>
  <main class="container">
    <h1>Esqueci minha senha</h1>
    <p>Informe o e-mail da sua conta. Se ele estiver cadastrado, enviaremos um link para criar uma nova senha.</p>

    <form id="formEsqueci">
      <label for="email">E-mail</label>
      <input type="email" id="email" autocomplete="email" required>

      <button type="submit" id="botaoEsqueci">Enviar link</button>
    </form>

    <p id="mensagemEsqueci" class="msg" role="status"></p>

    <div class="links-auxiliares">
      <a href="entrar.html">Voltar para entrar</a>
    </div>
  </main>

  <script src="../js/cliente/api.js"></script>
  <script src="../js/cliente/esqueci-senha.js"></script>
</body>
</html>
