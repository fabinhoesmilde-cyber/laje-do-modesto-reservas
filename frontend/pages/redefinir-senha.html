<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Nova senha - Laje do Modesto</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/cliente.css">
</head>
<body>
  <main class="container">
    <h1>Criar nova senha</h1>
    <p>Escolha a sua nova senha.</p>

    <form id="formSenha">
      <label for="senha">Nova senha</label>
      <input type="password" id="senha" autocomplete="new-password" minlength="8" required>
      <p class="dica">Use pelo menos 8 caracteres, sem ser só números nem uma senha comum.</p>

      <label for="confirmacao">Repita a nova senha</label>
      <input type="password" id="confirmacao" autocomplete="new-password" required>

      <button type="submit" id="botaoSenha">Salvar nova senha</button>
    </form>

    <p id="mensagemSenha" class="msg" role="status"></p>

    <div id="linksFinais" class="links-auxiliares" hidden>
      <a href="entrar.html">Entrar na minha conta</a>
    </div>
  </main>

  <script src="../js/cliente/api.js"></script>
  <script>
    const CONFIG_LINK = {
      caminho: "/cliente/redefinir-senha/",
      sucesso: "Senha alterada. Agora você já pode entrar."
    };
  </script>
  <script src="../js/cliente/senha_por_link.js"></script>
</body>
</html>
